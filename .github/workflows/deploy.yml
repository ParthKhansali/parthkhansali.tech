name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          BASE_PATH: '/E-Portfolio'
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDnm75VnMN2ud3RBTus8iHrL9yBotLGqqI"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "portfolio-2addd.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "portfolio-2addd"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "portfolio-2addd.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "198688956491"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:198688956491:web:612a343f875ba46d97edce"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "G-FSBSB33V30"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
